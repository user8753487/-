<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мерч Копеечка</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #d32f2f;
        }

        .gallery {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 300px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

            .card img {
                width: 100%;
                height: 300px;
                object-fit: cover;
                background-color: #eaeaea;
            }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Фирменный мерч «Копеечка»</h1>
        <p>Выберите изображение для вашего мерча (замените src на свои пути к фото)</p>
    </header>

    <div class="gallery">
        <div class="card">
            <img src="photo1.jpg" alt="Мерч Копеечка - Фото 1">
            <div class="card-content">
                <div class="card-title">Вариант мерча 1</div>
            </div>
        </div>
        <div class="card">
            <img src="photo2.jpg" alt="Мерч Копеечка - Фото 2">
            <div class="card-content">
                <div class="card-title">Вариант мерча 2</div>
            </div>
        </div>
    </div>

</body>
</html>
